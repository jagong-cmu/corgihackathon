[project]
name = "tutor-agent"
version = "0.1.0"
description = "Channel-agnostic tutor brain: persona, cue timing, and the realtime voice loop."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "jsonschema>=4.23",
]

# Real providers are optional so the whole package installs and tests offline
# with no API keys and no heavy transitive deps.
[project.optional-dependencies]
anthropic = ["anthropic>=0.69"]
elevenlabs = ["httpx>=0.27"]
cartesia = ["httpx>=0.27"]
# Optional so the offline test suite stays dependency-free.
db = ["psycopg[binary]>=3.2"]
postgres = ["asyncpg>=0.30"]
embeddings = ["httpx>=0.27"]
# Parsers for the upload path. Only the API process needs these; the voice loop
# reads text that is already in the index.
documents = ["pypdf>=5.1", "python-docx>=1.1", "python-pptx>=1.0"]
livekit = [
    "livekit-agents>=0.12",
    "livekit-plugins-cartesia>=1.6.7",
    "livekit-plugins-elevenlabs>=0.7",
    "livekit-plugins-lemonslice>=1.6.7",
    "livekit-plugins-simli>=1.6.7",
]

[project.scripts]
tutor = "tutor_agent.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tutor_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
